[project]
name = "touyan"
version = "0.1.0"
description = "上市公司周报研究与撰写系统"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-tavily>=0.2,<1",
    "langchain-mcp-adapters>=0.1,<1",
    "fastmcp>=2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.26,<2",
    "pymilvus>=2.6,<3",
    "pymysql[rsa]>=1.1,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    "tzdata>=2025.1",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
